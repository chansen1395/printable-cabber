name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Rebuild the STLs and STEPs (no renders)
        run: python cad/cabber.py --no-render
      - name: Check inventory, interference, clearances and printability
        run: python cad/check_clashes.py
